<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Adivinha o Personagem — Black Clover</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #1a1a2e;
    color: #eee;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 { margin: 0 0 5px; }
  .sub { color: #888; margin-bottom: 20px; font-size: 14px; }

  .pesquisa-wrap {
    position: relative;
    width: 100%;
    max-width: 500px;
  }
  #pesquisa {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    border-radius: 10px;
    border: 2px solid #333;
    background: #16213e;
    color: #fff;
    outline: none;
  }
  #pesquisa:focus { border-color: #538d4e; }
  #pesquisa:disabled { opacity: 0.5; cursor: not-allowed; }

  #sugestoes {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #16213e;
    border: 2px solid #333;
    border-top: none;
    border-radius: 0 0 10px 10px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 10;
    display: none;
  }
  #sugestoes.ativo { display: block; }
  .sugestao {
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid #222;
  }
  .sugestao:hover, .sugestao.destaque { background: #538d4e; }
  .sugestao:last-child { border-bottom: none; }
  .sugestao.vazio { color: #888; cursor: default; font-style: italic; }
  .sugestao.vazio:hover { background: transparent; }

  /* Barra com contador + botão jogar de novo */
  .barra-info {
    margin-top: 15px;
    display: flex;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .contador {
    color: #aaa;
    font-size: 15px;
    font-weight: bold;
  }

  /* Botão "Jogar de novo" com dupla confirmação */
  .btn-reiniciar {
    padding: 8px 16px;
    font-size: 14px;
    font-weight: bold;
    background: #f0c419;      /* amarelo normal */
    color: #222;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-reiniciar:hover {
    background: #d4a812;
  }
  .btn-reiniciar.confirmar {
    background: #a67c00;      /* amarelo escuro */
    color: #fff;
    animation: pulsar 0.8s infinite alternate;
  }
  @keyframes pulsar {
    from { transform: scale(1); }
    to   { transform: scale(1.05); }
  }

  /* Caixas de dicas */
  .dicas {
    margin-top: 15px;
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }
  @media (max-width: 600px) { .dicas { grid-template-columns: 1fr; } }

  .dica {
    background: #2a2a3e;
    border: 2px dashed #444;
    border-radius: 10px;
    padding: 15px;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: not-allowed;
    transition: all 0.3s;
    user-select: none;
  }
  .dica .titulo {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 6px;
    color: #aaa;
  }
  .dica .estado { font-size: 13px; color: #888; }
  .dica .texto  { font-size: 14px; color: #fff; line-height: 1.4; }

  .dica.bloqueada { opacity: 0.6; }

  .dica.desbloqueada {
    cursor: pointer;
    border-style: solid;
    border-color: #b59f3b;
    background: #2e2a1e;
  }
  .dica.desbloqueada:hover {
    border-color: #d4b74a;
    transform: translateY(-2px);
  }
  .dica.desbloqueada .titulo { color: #d4b74a; }
  .dica.desbloqueada .estado { color: #d4b74a; }

  .dica.aberta {
    cursor: default;
    border-style: solid;
    border-color: #538d4e;
    background: #1e2e1e;
  }
  .dica.aberta .titulo { color: #538d4e; }

  /* Tabuleiro — sem scroll horizontal */
  #tabuleiro {
    margin-top: 25px;
    width: 100%;
    max-width: 1100px;
  }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 4px;
    table-layout: fixed;
  }
  th {
    color: #aaa;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    padding: 4px 2px;
    word-wrap: break-word;
  }
  td {
    padding: 10px 4px;
    text-align: center;
    border-radius: 8px;
    font-weight: bold;
    font-size: 12px;
    background: #2a2a3e;
    text-transform: capitalize;
    word-wrap: break-word;
  }
  td.verde    { background: #538d4e; color: #fff; }
  td.amarelo  { background: #b59f3b; color: #fff; }
  td.vermelho { background: #c0392b; color: #fff; }

  tr.nova-linha { animation: aparecer 0.5s ease; }
  @keyframes aparecer {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #msg {
    margin-top: 20px; font-size: 20px; font-weight: bold;
    min-height: 28px; text-align: center;
  }
</style>
</head>
<body>

<h1>🕵️ Adivinha o Personagem — Black Clover</h1>
<p class="sub">{{ total_personagens }} personagens · tentativas infinitas · 2 dicas</p>

<div class="pesquisa-wrap">
  <input id="pesquisa" type="text" placeholder="Clica para ver todos ou escreve para filtrar..." autocomplete="off">
  <div id="sugestoes"></div>
</div>

<!-- Contador + botão jogar de novo, lado a lado -->
<div class="barra-info">
  <div class="contador" id="contador">Tentativas: 0</div>
  <button class="btn-reiniciar" id="btnReiniciar" onclick="confirmarReiniciar()">
    🔄 Jogar de novo
  </button>
</div>

<!-- Caixas de dicas -->
<div class="dicas">
  <div class="dica bloqueada" id="dica1" onclick="pedirDica(1)">
    <div class="titulo">💡 Dica 1</div>
    <div class="estado" id="estado1">Bloqueada — erra {{ dica1_apos }} vezes</div>
    <div class="texto" id="texto1"></div>
  </div>
  <div class="dica bloqueada" id="dica2" onclick="pedirDica(2)">
    <div class="titulo">💡 Dica 2</div>
    <div class="estado" id="estado2">Bloqueada — erra {{ dica2_apos }} vezes</div>
    <div class="texto" id="texto2"></div>
  </div>
</div>

<div id="tabuleiro">
  <table>
    <thead>
      <tr>
        <th>Personagem</th>
        {% for c in caracteristicas %}
          <th>{{ c.nome }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody id="corpo"></tbody>
  </table>
</div>

<div id="msg"></div>

<script>
const DICA1_APOS = Number(" {{ dica1_apos }}");
const DICA2_APOS = Number(" {{ dica2_apos }}");
const sid = Math.random().toString(36).slice(2) + Date.now();
const input = document.getElementById("pesquisa");
const sugestoes = document.getElementById("sugestoes");
const corpo = document.getElementById("corpo");
const msg = document.getElementById("msg");
const contador = document.getElementById("contador");
const btnReiniciar = document.getElementById("btnReiniciar");

let jogoAtivo = true;
let indiceDestaque = -1;
let aguardandoConfirmacao = false;  // controla o duplo clique

// ---------- Iniciar ----------
async function iniciarJogo() {
  await fetch("/novo_jogo", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({sid})
  });
  corpo.innerHTML = "";
  msg.textContent = "";
  msg.style.color = "";
  input.disabled = false;
  input.value = "";
  jogoAtivo = true;
  contador.textContent = "Tentativas: 0";
  sugestoes.classList.remove("ativo");
  sugestoes.innerHTML = "";
  resetarBotao();
  resetarDicas();
  input.focus();
}

// ---------- Botão jogar de novo (dupla confirmação) ----------
function confirmarReiniciar() {
  if (!aguardandoConfirmacao) {
    // Primeiro clique: pede confirmação
    aguardandoConfirmacao = true;
    btnReiniciar.classList.add("confirmar");
    btnReiniciar.textContent = "⚠️ Clique outra vez para confirmar";
  } else {
    // Segundo clique: reinicia
    iniciarJogo();
  }
}

function resetarBotao() {
  aguardandoConfirmacao = false;
  btnReiniciar.classList.remove("confirmar");
  btnReiniciar.textContent = "🔄 Jogar de novo";
}

// Se clicares fora do botão, cancela a confirmação
document.addEventListener("click", e => {
  if (aguardandoConfirmacao && !e.target.closest("#btnReiniciar")) {
    resetarBotao();
  }
});

// ---------- Dicas ----------
function resetarDicas() {
  for (let i = 1; i <= 2; i++) {
    const caixa = document.getElementById("dica" + i);
    caixa.className = "dica bloqueada";
    document.getElementById("texto" + i).textContent = "";
    const limite = (i === 1) ? DICA1_APOS : DICA2_APOS;
    document.getElementById("estado" + i).textContent =
      `Bloqueada — erra ${limite} vezes`;
  }
}

function atualizarDicas(numTentativas) {
  for (let i = 1; i <= 2; i++) {
    const caixa = document.getElementById("dica" + i);
    const limite = (i === 1) ? DICA1_APOS : DICA2_APOS;
    const estado = document.getElementById("estado" + i);

    if (caixa.classList.contains("aberta")) continue;

    if (numTentativas >= limite) {
      caixa.className = "dica desbloqueada";
      estado.textContent = "Clique para revelar!";
    } else {
      caixa.className = "dica bloqueada";
      const faltam = limite - numTentativas;
      estado.textContent = `Faltam ${faltam} tentativas erradas`;
    }
  }
}

async function pedirDica(numero) {
  const caixa = document.getElementById("dica" + numero);
  if (!caixa.classList.contains("desbloqueada")) return;

  const r = await fetch("/dica/" + numero, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({sid})
  });
  const data = await r.json();

  if (data.erro) {
    document.getElementById("estado" + numero).textContent = data.erro;
    return;
  }

  caixa.className = "dica aberta";
  document.getElementById("estado" + numero).textContent = "";
  document.getElementById("texto" + numero).textContent = data.texto;
}

// ---------- Pesquisa ----------
async function atualizarSugestoes(q) {
  const r = await fetch(
    `/procurar?q=${encodeURIComponent(q)}&sid=${encodeURIComponent(sid)}`
  );
  const data = await r.json();

  if (data.resultados.length === 0) {
    sugestoes.innerHTML = '<div class="sugestao vazio">Nenhum resultado</div>';
  } else {
    sugestoes.innerHTML = data.resultados
      .map(n => `<div class="sugestao" data-nome="${n}">${n}</div>`)
      .join("");
  }
  sugestoes.classList.add("ativo");
  indiceDestaque = -1;
}

let temporizador;
input.addEventListener("input", () => {
  clearTimeout(temporizador);
  temporizador = setTimeout(() => {
    atualizarSugestoes(input.value.trim());
  }, 120);
});

input.addEventListener("focus", () => atualizarSugestoes(input.value.trim()));
input.addEventListener("click", () => {
  if (!sugestoes.classList.contains("ativo")) {
    atualizarSugestoes(input.value.trim());
  }
});

sugestoes.addEventListener("click", e => {
  const el = e.target.closest(".sugestao");
  if (el && el.dataset.nome) selecionar(el.dataset.nome);
});

input.addEventListener("keydown", e => {
  const itens = [...sugestoes.querySelectorAll(".sugestao[data-nome]")];

  if (e.key === "ArrowDown") {
    e.preventDefault();
    if (!sugestoes.classList.contains("ativo")) {
      atualizarSugestoes(input.value.trim());
      return;
    }
    indiceDestaque = Math.min(indiceDestaque + 1, itens.length - 1);
    atualizarDestaque(itens);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    indiceDestaque = Math.max(indiceDestaque - 1, 0);
    atualizarDestaque(itens);
  } else if (e.key === "Enter") {
    if (indiceDestaque >= 0 && itens[indiceDestaque]) {
      selecionar(itens[indiceDestaque].dataset.nome);
    } else if (itens.length === 1) {
      selecionar(itens[0].dataset.nome);
    }
  } else if (e.key === "Escape") {
    sugestoes.classList.remove("ativo");
  }
});

function atualizarDestaque(itens) {
  itens.forEach((it, i) => it.classList.toggle("destaque", i === indiceDestaque));
}

document.addEventListener("click", e => {
  if (!e.target.closest(".pesquisa-wrap")) sugestoes.classList.remove("ativo");
});

// ---------- Enviar tentativa ----------
async function selecionar(nome) {
  if (!jogoAtivo) return;
  sugestoes.classList.remove("ativo");
  input.value = "";

  const r = await fetch("/tentativa", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({sid, nome})
  });
  const data = await r.json();

  if (data.erro) {
    msg.textContent = "⚠️ " + data.erro;
    msg.style.color = "#b59f3b";
    return;
  }

  msg.textContent = "";
  msg.style.color = "";
  adicionarLinha(nome, data.resultado);
  contador.textContent = `Tentativas: ${data.num_tentativas}`;

  atualizarDicas(data.num_tentativas);

  if (data.venceu) {
    msg.textContent = "🎉 Acertaste! Era o " + nome + "!";
    msg.style.color = "#538d4e";
    jogoAtivo = false;
    input.disabled = true;
  }
}

function adicionarLinha(nome, resultado) {
  const tr = document.createElement("tr");
  tr.className = "nova-linha";

  const tdNome = document.createElement("td");
  tdNome.textContent = nome;
  tdNome.style.background = "#3a3a5e";
  tdNome.style.color = "#fff";
  tr.appendChild(tdNome);

  resultado.forEach((celula, i) => {
    const td = document.createElement("td");
    td.textContent = celula.valor;
    setTimeout(() => td.classList.add(celula.cor), 80 * i);
    tr.appendChild(td);
  });

  corpo.insertBefore(tr, corpo.firstChild);
}

iniciarJogo();
</script>
</body>
</html>
